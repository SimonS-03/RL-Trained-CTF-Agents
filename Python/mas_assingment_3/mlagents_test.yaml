default_settings:
  trainer_type: ppo
  hyperparameters:
    batch_size: 4096
    buffer_size: 40960
    learning_rate: 3.0e-4
    beta: 5.0e-3
    epsilon: 0.2
    lambd: 0.95
    num_epoch: 3
    learning_rate_schedule: linear
  network_settings:
    normalize: false
    hidden_units: 128
    num_layers: 2
  reward_signals:
    extrinsic:
      gamma: 0.995
      strength: 1.0
  max_steps: 60000000
  time_horizon: 128
  summary_freq: 10000
  keep_checkpoints: 10
  checkpoint_interval: 500000

behaviors:
  TestBehavior:
    trainer_type: ppo
    hyperparameters:
      batch_size: 4096
      buffer_size: 40960
      learning_rate: 3.0e-4
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: false
      hidden_units: 256
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
    max_steps: 60000000
    time_horizon: 128
    summary_freq: 10000
    keep_checkpoints: 10
    checkpoint_interval: 500000

environment_parameters: {}
engine_settings:
  time_scale: 20
  target_frame_rate: -1
  capture_frame_rate: 60
  no_graphics: true

checkpoint_settings:
  run_id: test
  initialize_from: null
  load_model: false
  resume: false

torch_settings:
  device: cuda

env_settings:
  env_path: null
  num_envs: 8
  seed: 1
  num_areas: 10
  max_lifetime_restarts: 10
  restarts_rate_limit_n: 1
  restarts_rate_limit_period_s: 60
