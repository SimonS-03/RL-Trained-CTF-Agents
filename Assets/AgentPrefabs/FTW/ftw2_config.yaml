behaviors:
  ftw:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 0.0003
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear

    network_settings:
      normalize: true
      hidden_units: 512
      num_layers: 2
      vis_encode_type: simple
      memory:
        memory_size: 128
        sequence_length: 64
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    self_play:
      save_steps: 80000
      team_change: 100000
      swap_steps: 40000
      window: 10
      play_against_latest_model_ratio: 0.5
      initial_elo: 500
      
            
      
    max_steps: 100000000
    time_horizon: 64
    summary_freq: 10000
